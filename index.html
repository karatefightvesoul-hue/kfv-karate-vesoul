async function syncUp(){if(!confirm('Remplacer la version en ligne par celle de CET appareil ? Tous les autres appareils seront mis à jour.'))return;const a=await pushD(true);await pushA();if(a)alert('Tous les appareils afficheront cette version.')}

async function diag(){const k=akey(),o=$('#diag');o.textContent='Test en cours…';const t=[['Licences',LIC_URL,['?action=list&key='+encodeURIComponent(k),'?action=getdata']],['Synchro appareils',SYNC_URL,['?action=getdata','?action=list&key='+encodeURIComponent(k)]],['Apparence',SITE_URL,['?action=getapp']]];let out='',hint=[];

if(j&&j.error=='Code incorrect'){try{localStorage.removeItem('kfv_akey')}catch(e){}hint.indexOf('code')<0&&hint.push('code')}
if(j&&j.error=='action inconnue'&&hint.indexOf('old')<0)hint.push('old');if(j&&/réseau/.test(j.error||'')&&hint.indexOf('net')<0)hint.push('net')}}
if(hint.indexOf('code')>=0)out+='\n➡ Le code saisi ne correspond pas à CODE_SECRET du script Google. Cliquez de nouveau sur « Tester les connexions » pour ressaisir le code (le même que dans le script).';
if(hint.indexOf('old')>=0)out+='\n➡ Un script est ancien (action inconnue) : collez « script-google-kfv.gs » dans le projet Apps Script, puis Déployer > Gérer les déploiements > Nouvelle version.';
if(hint.indexOf('net')>=0)out+='\n➡ Un script est injoignable : vérifiez Déployer > Application Web > Accès : « Tout le monde ».';
o.innerHTML=esc(out)+'\n\nOuvrir l\'adresse pour voir ce que répond Google :\n<a target="_blank" rel="noopener" href="'+LIC_URL+'">script Licences / Synchro</a> · <a target="_blank" rel="noopener" href="'+SITE_URL+'">script Apparence</a>\nLa page doit afficher {"ok":true}. Si Google affiche une connexion, « Fichier introuvable » ou une erreur, le déploiement est à refaire : Déployer > Nouveau déploiement > Application Web > Exécuter en tant que : Moi > Accès : Tout le monde.'}

async function autoPull(){if(syncBusy||document.hidden)return;if($('#mod').classList.contains('on'))return;syncBusy=true;try{const r=await Promise.all([pullD(false),pullA(false)]);if(r.some(Boolean)){skin();go()}}catch(e){}syncBusy=false}
