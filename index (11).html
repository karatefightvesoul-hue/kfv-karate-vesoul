<style>
:root{--bg:#0f0f12;--fg:#f4f1ea;--card:#1a1a20;--mut:#a9a59b;--red:#d7263d;--line:#2b2b33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ec;--fg:#16161a;--card:#fff;--mut:#5f5b52;--line:#ddd8cc}}
:root[data-theme="dark"]{--bg:#0f0f12;--fg:#f4f1ea;--card:#1a1a20;--mut:#a9a59b;--line:#2b2b33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 .5em}
h2{font-size:2rem}h2:after{content:"";display:block;width:56px;height:4px;background:var(--red);margin-top:8px}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--red)}
.bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none}.logo b{color:var(--red)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav a{padding:8px 10px;text-decoration:none;font-weight:600;font-size:.9rem;border-radius:6px}
nav a:hover,nav a.on{background:var(--red);color:#fff}
#burger{display:none;background:none;border:2px solid var(--red);color:var(--fg);font-size:1.3rem;border-radius:6px;padding:2px 10px}
@media(max-width:1100px){#burger{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 16px;border-bottom:2px solid var(--red)}nav.open{display:flex;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}}
main{min-height:70vh}.wrap{max-width:1150px;margin:auto;padding:56px 16px}
.hero{position:relative;min-height:82vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a0b12,#0a0a0d 70%) center/cover}
.hero:before{content:"";position:absolute;width:min(70vw,520px);aspect-ratio:1;border-radius:50%;background:var(--red);opacity:.9;top:8%;filter:blur(1px);animation:pulse 6s ease-in-out infinite}
.hero:after{content:"空手";position:absolute;bottom:-4%;right:3%;font:700 clamp(6rem,22vw,16rem)/1 serif;opacity:.08}
.hero>div{position:relative;padding:24px;background:linear-gradient(#0000,#0008);border-radius:12px}
.hero h1{font-size:clamp(3rem,12vw,7rem);line-height:1;text-shadow:0 4px 20px #000}.hero p{font-size:1.25rem;max-width:620px;margin:12px auto 24px;text-shadow:0 2px 8px #000}
@keyframes pulse{50%{transform:scale(1.06)}}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 24px;border-radius:6px;font-weight:600;text-decoration:none;border:2px solid var(--red);cursor:pointer;font:600 1rem Inter;margin:4px;transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;color:inherit;border-color:currentColor}
.hero .btn.o{color:#fff}
.soc{display:flex;justify-content:center;gap:14px;margin-top:22px}.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#0007;border:2px solid #fff6;transition:.2s}.soc a:hover{background:var(--red);border-color:var(--red);transform:translateY(-3px)}.soc svg{width:22px;height:22px;fill:currentColor}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;border-top:4px solid var(--red);animation:up .5s both}
.card img{width:100%;height:180px;object-fit:cover;border-radius:6px;margin-bottom:10px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.mut{color:var(--mut);font-size:.9rem}.tag{display:inline-block;background:var(--red);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:600}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start}th{background:var(--red);color:#fff;font-family:Oswald;text-transform:uppercase}
.gal{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.gt{position:relative;cursor:zoom-in;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--card);border:1px solid var(--line);transition:.2s;display:grid;place-items:center}.gf{cursor:zoom-in;display:flex;flex-direction:column;gap:6px}.gf:hover .gt{transform:scale(1.03)}.gf .gt{cursor:zoom-in}.gc{font-size:.9rem;line-height:1.3;text-align:center;color:var(--fg);word-break:break-word;min-height:1.2em}.pv{display:block;max-width:100%;max-height:200px;margin:8px auto 0;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:var(--card)}.pv:not([src]),.pv[src='']{display:none}.gt img{width:100%;height:100%;object-fit:cover}.pl{position:absolute;background:#000a;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem}.gt em{font-style:normal;font-size:.85rem;color:var(--mut);text-align:center}
.chips{margin-bottom:16px}.chips button{margin:3px;padding:6px 14px;border-radius:99px;border:1px solid var(--red);background:none;color:var(--fg);cursor:pointer}.chips .on{background:var(--red);color:#fff}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;place-items:center;padding:16px}#lb.on{display:grid}#lb img,#lb video{max-width:100%;max-height:80vh;border-radius:6px}#lb p{color:#fff;text-align:center}
#lb button{position:absolute;background:#0008;color:#fff;border:0;font-size:2rem;padding:8px 16px;cursor:pointer;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--card);min-height:56px;padding:4px;border-radius:6px;font-size:.85rem;border:1px solid var(--line)}
.cal .h{min-height:0;background:none;border:0;font-weight:600;text-align:center}.cal .d{cursor:pointer}.cal .d.has{border-color:var(--red)}.cal .d.sel{background:var(--red);color:#fff}
.cal i{display:block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-top:4px}
form{display:grid;gap:10px;max-width:560px}input,select,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
label{font-weight:600;font-size:.9rem}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.ev{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.ev .dt{background:var(--red);color:#fff;padding:6px 10px;border-radius:6px;text-align:center;min-width:64px;font-family:Oswald}
footer{background:#000;color:#ddd;text-align:center;padding:28px 16px;border-top:2px solid var(--red)}footer a{color:#ddd}
.map{background:repeating-linear-gradient(45deg,var(--card),var(--card) 12px,var(--line) 12px,var(--line) 13px);border-radius:10px;height:220px;display:grid;place-items:center;text-align:center;border:1px solid var(--line)}
#ab{display:none;background:#111;color:#fff;padding:8px 16px;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--red);font-size:.9rem}#ab.on{display:flex}#ab button{margin-left:auto;background:var(--red);color:#fff;border:0;padding:6px 14px;border-radius:6px;cursor:pointer}#sec{cursor:default}
.fiche{max-width:780px}.fh{text-align:center;border:2px solid var(--line);padding:14px}.fb{border:2px solid var(--line);padding:12px;margin:14px 0}.fb.g{border-color:#6aa84f}.fb b{display:block;background:var(--line);text-align:center;padding:4px;margin-bottom:8px;text-transform:uppercase}.fiche form{max-width:none}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .w{grid-column:1/-1}@media(max-width:600px){.fg{grid-template-columns:1fr}}
.po,.sigbox{display:none}

.adm td button{margin:2px;padding:4px 10px;cursor:pointer}

.hzc{font-weight:600}
