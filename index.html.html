<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KFV – Karaté à Vesoul</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--fg:#f4f1ea;--card:#1a1a20;--mut:#a9a59b;--red:#d7263d;--line:#2b2b33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ec;--fg:#16161a;--card:#fff;--mut:#5f5b52;--line:#ddd8cc}}
:root[data-theme="dark"]{--bg:#0f0f12;--fg:#f4f1ea;--card:#1a1a20;--mut:#a9a59b;--line:#2b2b33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 .5em}
h2{font-size:2rem}h2:after{content:"";display:block;width:56px;height:4px;background:var(--red);margin-top:8px}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--red)}
.bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none}.logo b{color:var(--red)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav a{padding:8px 10px;text-decoration:none;font-weight:600;font-size:.9rem;border-radius:6px}
nav a:hover,nav a.on{background:var(--red);color:#fff}
#burger{display:none;background:none;border:2px solid var(--red);color:var(--fg);font-size:1.3rem;border-radius:6px;padding:2px 10px}
@media(max-width:980px){#burger{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 16px;border-bottom:2px solid var(--red)}nav.open{display:flex}}
main{min-height:70vh}.wrap{max-width:1150px;margin:auto;padding:56px 16px}
.hero{position:relative;min-height:82vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a0b12,#0a0a0d 70%) center/cover}
.hero:before{content:"";position:absolute;width:min(70vw,520px);aspect-ratio:1;border-radius:50%;background:var(--red);opacity:.9;top:8%;filter:blur(1px);animation:pulse 6s ease-in-out infinite}
.hero:after{content:"空手";position:absolute;bottom:-4%;right:3%;font:700 clamp(6rem,22vw,16rem)/1 serif;opacity:.08}
.hero>div{position:relative;padding:24px;background:linear-gradient(#0000,#0008);border-radius:12px}
.hero h1{font-size:clamp(3rem,12vw,7rem);line-height:1;text-shadow:0 4px 20px #000}.hero p{font-size:1.25rem;max-width:620px;margin:12px auto 24px;text-shadow:0 2px 8px #000}
@keyframes pulse{50%{transform:scale(1.06)}}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 24px;border-radius:6px;font-weight:600;text-decoration:none;border:2px solid var(--red);cursor:pointer;font:600 1rem Inter;margin:4px;transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;color:inherit;border-color:currentColor}
.hero .btn.o{color:#fff}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;border-top:4px solid var(--red);animation:up .5s both}
.card img{width:100%;height:180px;object-fit:cover;border-radius:6px;margin-bottom:10px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.mut{color:var(--mut);font-size:.9rem}.tag{display:inline-block;background:var(--red);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:600}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--red);color:#fff;font-family:Oswald;text-transform:uppercase}
.gal{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.gt{position:relative;cursor:zoom-in;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--card);border:1px solid var(--line);transition:.2s;display:grid;place-items:center}.gt:hover{transform:scale(1.03)}.gt img{width:100%;height:100%;object-fit:cover}.pl{position:absolute;background:#000a;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem}.gt em{font-style:normal;font-size:.85rem;color:var(--mut);text-align:center}
.chips{margin-bottom:16px}.chips button{margin:3px;padding:6px 14px;border-radius:99px;border:1px solid var(--red);background:none;color:var(--fg);cursor:pointer}.chips .on{background:var(--red);color:#fff}
#lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;place-items:center;padding:16px}#lb.on{display:grid}#lb img,#lb video{max-width:100%;max-height:80vh;border-radius:6px}#lb p{color:#fff;text-align:center}
#lb button{position:absolute;background:#0008;color:#fff;border:0;font-size:2rem;padding:8px 16px;cursor:pointer;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--card);min-height:56px;padding:4px;border-radius:6px;font-size:.85rem;border:1px solid var(--line)}
.cal .h{min-height:0;background:none;border:0;font-weight:600;text-align:center}.cal .d{cursor:pointer}.cal .d.has{border-color:var(--red)}.cal .d.sel{background:var(--red);color:#fff}
.cal i{display:block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-top:4px}
form{display:grid;gap:10px;max-width:560px}input,select,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
label{font-weight:600;font-size:.9rem}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.ev{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.ev .dt{background:var(--red);color:#fff;padding:6px 10px;border-radius:6px;text-align:center;min-width:64px;font-family:Oswald}
footer{background:#000;color:#ddd;text-align:center;padding:28px 16px;border-top:2px solid var(--red)}footer a{color:#ddd}
.map{background:repeating-linear-gradient(45deg,var(--card),var(--card) 12px,var(--line) 12px,var(--line) 13px);border-radius:10px;height:220px;display:grid;place-items:center;text-align:center;border:1px solid var(--line)}
#ab{display:none;background:#111;color:#fff;padding:8px 16px;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--red);font-size:.9rem}#ab.on{display:flex}#ab button{margin-left:auto;background:var(--red);color:#fff;border:0;padding:6px 14px;border-radius:6px;cursor:pointer}#sec{cursor:default}
.adm td button{margin:2px;padding:4px 10px;cursor:pointer}
#mod{position:fixed;inset:0;background:#000b;z-index:60;display:none;overflow:auto;padding:16px}#mod.on{display:block}#mod form{background:var(--card);padding:20px;border-radius:10px;margin:auto;max-width:560px}
</style></head><body>
<header><div class="bar"><a class="logo" href="#accueil"><b>KFV</b> Karaté à Vesoul</a><button id="burger" aria-label="Menu">☰</button><nav id="nav"></nav></div></header>
<div id="ab"><span>🔒 Mode administrateur</span><a href="#admin">Gérer le site</a><a href="#accueil">Voir le site</a><button onclick="logout()">Déconnexion</button></div>
<main id="app"></main>
<footer><p><b>KFV – Karaté à Vesoul</b> · <span id="fa"></span></p><p class="mut">© 2026 <span id="sec">KFV</span></p></footer>
<div id="lb"><button style="left:8px" onclick="lbGo(-1)">‹</button><div style="text-align:center"><img id="lbi"><video id="lbv" controls playsinline style="display:none"></video><p id="lbc"></p></div><button style="right:8px" onclick="lbGo(1)">›</button><button style="top:8px;right:8px" onclick="lbClose()">✕</button></div>
<div id="mod"></div>
<script>
const D0={club:{nom:"KFV – Karaté à Vesoul",accroche:"Discipline, respect, dépassement de soi : le karaté à Vesoul, de 5 ans à tout âge.",presentation:"KFV est un club de karaté de Vesoul ouvert à tous : enfants, adolescents et adultes, du loisir à la compétition. Nos professeurs transmettent les valeurs du dojo : respect, humilité, persévérance et esprit d'équipe.",adresse:"Dojo municipal, Vesoul (70000) – adresse à compléter",tel:"03 00 00 00 00",email:"contact@kfv-vesoul.fr",facebook:"https://facebook.com",instagram:"https://instagram.com",tarifs:"Enfants (5-11 ans) : 130 € / an\nAdolescents (12-17 ans) : 150 € / an\nAdultes : 180 € / an\nCours d'essai : 2 séances gratuites",docs:"Certificat médical de non contre-indication\nFormulaire d'inscription complété\nPhoto d'identité\nRèglement de la cotisation",hero:""},
courses:[{name:"Enfants",age:"5 – 11 ans",desc:"Éveil, coordination, jeux et premières bases du karaté dans la bonne humeur.",time:"Mercredi 17h30 – 18h30",place:"Dojo de Vesoul"},{name:"Adolescents",age:"12 – 17 ans",desc:"Technique, kata, kumite et préparation mentale.",time:"Mardi et vendredi 18h30 – 19h30",place:"Dojo de Vesoul"},{name:"Adultes",age:"18 ans et +",desc:"Condition physique, self-défense et technique traditionnelle.",time:"Lundi et jeudi 19h30 – 21h",place:"Dojo de Vesoul"},{name:"Débutants",age:"Tous âges",desc:"Apprentissage des bases : postures, déplacements, premiers katas.",time:"Mercredi 18h30 – 19h30",place:"Dojo de Vesoul"},{name:"Confirmés",age:"Ceintures marron et +",desc:"Perfectionnement technique et préparation aux passages de grades.",time:"Jeudi 19h30 – 21h",place:"Dojo de Vesoul"},{name:"Compétition",age:"Sur sélection",desc:"Entraînement intensif kata et kumite pour les compétiteurs.",time:"Samedi 10h – 12h",place:"Dojo de Vesoul"}],
schedule:[{day:"Lundi",time:"19h30 – 21h",course:"Adultes",place:"Dojo de Vesoul"},{day:"Mardi",time:"18h30 – 19h30",course:"Adolescents",place:"Dojo de Vesoul"},{day:"Mercredi",time:"17h30 – 18h30",course:"Enfants",place:"Dojo de Vesoul"},{day:"Jeudi",time:"19h30 – 21h",course:"Adultes / Confirmés",place:"Dojo de Vesoul"},{day:"Samedi",time:"10h – 12h",course:"Compétition",place:"Dojo de Vesoul"}],
events:[{title:"Reprise des entraînements",date:"2026-10-05",time:"18h30",place:"Dojo de Vesoul",type:"Entraînement",desc:"Reprise pour tous les groupes."},{title:"Stage départemental",date:"2026-11-14",time:"9h – 17h",place:"Gymnase, Vesoul",type:"Stage",desc:"Stage ouvert à toutes les ceintures."},{title:"Passage de grades",date:"2026-12-12",time:"14h",place:"Dojo de Vesoul",type:"Passage de grade",desc:"Passage de ceintures, convocation par mail."},{title:"Championnat régional",date:"2027-01-24",time:"9h",place:"À confirmer",type:"Compétition",desc:"Kata et kumite, catégories jeunes et adultes."}],
news:[{title:"Bienvenue sur le nouveau site du KFV",date:"2026-09-28",cat:"Club",img:"",text:"Retrouvez ici les horaires, le calendrier, les résultats et les photos du club."}],
comps:[{title:"Coupe de Franche-Comté",date:"2026-10-25",place:"À confirmer",status:"À venir",desc:"Inscriptions auprès des professeurs avant le 10 octobre.",img:""}],
gallery:[]};
let D;try{D=JSON.parse(localStorage.getItem('kfv'))||D0}catch(e){D=D0}
const save=()=>{try{localStorage.setItem('kfv',JSON.stringify(D))}catch(e){alert("Stockage plein : supprimez des photos ou exportez vos données.")}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nl=s=>esc(s).replace(/\n/g,'<br>');
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const P=[["accueil","Accueil"],["club","Le club"],["cours","Cours"],["horaires","Horaires"],["calendrier","Calendrier"],["galerie","Galerie photos"],["competitions","Compétitions"],["actualites","Actualités"],["inscriptions","Inscriptions"],["contact","Contact"]];
const sortD=a=>[...a].sort((x,y)=>x.date<y.date?-1:1);
const today=()=>new Date().toISOString().slice(0,10);
const courses=()=>`<div class="grid">${D.courses.map(c=>`<div class="card"><span class="tag">${esc(c.age)}</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><p class="mut">🕒 ${esc(c.time)}<br>📍 ${esc(c.place)}</p></div>`).join('')}</div>`;
const sched=()=>`<div class="tbl"><table><tr><th>Jour</th><th>Heure</th><th>Cours</th><th>Lieu</th></tr>${D.schedule.map(s=>`<tr><td>${esc(s.day)}</td><td>${esc(s.time)}</td><td>${esc(s.course)}</td><td>${esc(s.place)}</td></tr>`).join('')}</table></div>`;
const evs=(l,n)=>{let a=sortD(l);if(n)a=a.filter(e=>e.date>=today()).slice(0,n);return a.map(e=>{const d=new Date(e.date+'T00:00');return`<div class="ev"><div class="dt">${d.getDate()}<br><small>${d.toLocaleDateString('fr-FR',{month:'short'})}</small></div><div><span class="tag">${esc(e.type)}</span> <b>${esc(e.title)}</b><br><span class="mut">${esc(e.time)} · ${esc(e.place)}</span><br>${esc(e.desc)}</div></div>`}).join('')||'<p class="mut">Aucun événement à venir.</p>'};
const news=n=>`<div class="grid">${sortD(D.news).reverse().slice(0,n||99).map(a=>`<article class="card">${a.img?`<img src="${a.img}" alt="">`:''}<span class="tag">${esc(a.cat)}</span> <span class="mut">${fmt(a.date)}</span><h3>${esc(a.title)}</h3><p>${nl(a.text)}</p></article>`).join('')}</div>`;
const sec=(t,h)=>`<section class="wrap"><h2>${t}</h2>${h}</section>`;
const mailForm=(id,subj)=>`<form onsubmit="return sendMail(event,'${subj}')"><label>Nom<input name="n" required></label><label>Email<input name="e" type="email" required></label><label>Téléphone<input name="t"></label>${id?`<label>Cours souhaité<select name="c">${D.courses.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><label>Date de naissance<input name="b" type="date"></label>`:''}<label>Message<textarea name="m" rows="4"></textarea></label><button class="btn">Envoyer</button></form>`;
function sendMail(ev,s){ev.preventDefault();const f=new FormData(ev.target);const b=[...f.entries()].map(([k,v])=>k+' : '+v).join('\n');location.href=`mailto:${D.club.email}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;return false}
let LB=[];
const tiles=g=>`<div class="gal">${g.map((x,i)=>`<div class="gt" onclick="lbOpen(${i})"><img src="${x.img}" alt="${esc(x.caption)}" loading="lazy">${x.vid?'<span class="pl">▶</span>':''}</div>`).join('')}</div>`;
const prev=()=>{const g=D.gallery.slice(-6).reverse();LB=g;return(g.length?tiles(g):`<div class="gal">${'<div class="gt"><em>🥋<br>Photo à venir</em></div>'.repeat(6)}</div>`)+'<p><a class="btn o" href="#galerie">Voir toutes les photos et vidéos</a></p>'};
let gcat='Tout',gi=0,cal={y:new Date().getFullYear(),m:new Date().getMonth(),s:null};
const R={
accueil:()=>`<div class="hero" style="${D.club.hero?`background-image:linear-gradient(#0008,#000c),url(${D.club.hero})`:''}"><div><h1>KFV</h1><h3>Karaté à Vesoul</h3><p>${esc(D.club.accroche)}</p><a class="btn" href="#club">Découvrir le club</a><a class="btn o" href="#contact">Nous contacter</a></div></div>`+sec('Le club',`<p style="max-width:760px">${nl(D.club.presentation)}</p>`)+sec('Les cours',courses())+sec('Photos et vidéos',prev())+sec('Les horaires',sched())+sec('Prochains événements',evs(D.events,4)+'<a class="btn o" href="#calendrier">Voir le calendrier</a>')+sec('Dernières actualités',news(3)),
club:()=>sec('Le club',`<div class="two"><div><p>${nl(D.club.presentation)}</p><h3>Nos valeurs</h3><p>Respect · Courtoisie · Persévérance · Maîtrise de soi · Esprit d'équipe</p></div><div class="card"><h3>Infos pratiques</h3><p>📍 ${esc(D.club.adresse)}<br>📞 ${esc(D.club.tel)}<br>✉️ ${esc(D.club.email)}</p></div></div>`),
cours:()=>sec('Cours',courses()),
horaires:()=>sec('Horaires',sched()),
calendrier:()=>{const{y,m,s}=cal,first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),p=x=>String(x).padStart(2,'0'),key=d=>`${y}-${p(m+1)}-${p(d)}`;let c=['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(first);for(let d=1;d<=n;d++){const h=D.events.some(e=>e.date==key(d));c+=`<div class="d${h?' has':''}${s==key(d)?' sel':''}" onclick="cal.s='${key(d)}';go()">${d}${h?'<i></i>':''}</div>`}const list=D.events.filter(e=>s?e.date==s:e.date.startsWith(y+'-'+p(m+1)));return sec('Calendrier',`<p><button class="btn o" onclick="cm(-1)">‹</button> <b style="text-transform:capitalize">${new Date(y,m).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b> <button class="btn o" onclick="cm(1)">›</button></p><div class="cal">${c}</div><h3 style="margin-top:24px">${s?fmt(s)+' <button class="btn o" onclick="cal.s=null;go()">Tout le mois</button>':'Événements du mois'}</h3>${evs(list)||''}${list.length?'':'<p class="mut">Aucun événement.</p>'}`)},
galerie:()=>{const cats=['Tout','Entraînements','Compétitions','Stages','Événements','Membres','Récompenses'];const g=D.gallery.filter(x=>gcat=='Tout'||x.cat==gcat);LB=g;return sec('Photos et vidéos',`<div class="chips">${cats.map(c=>`<button class="${c==gcat?'on':''}" onclick="gcat='${c}';go()">${c}</button>`).join('')}</div>${g.length?tiles(g):'<p class="mut">Les photos et vidéos du club arrivent bientôt.</p>'}`)},
competitions:()=>{const u=D.comps.filter(c=>c.status!='Résultat'),r=D.comps.filter(c=>c.status=='Résultat');const f=l=>`<div class="grid">${sortD(l).map(c=>`<div class="card">${c.img?`<img src="${c.img}" alt="">`:''}<span class="tag">${esc(c.status)}</span><h3>${esc(c.title)}</h3><p class="mut">${fmt(c.date)} · ${esc(c.place)}</p><p>${nl(c.desc)}</p></div>`).join('')}</div>`;return sec('Compétitions à venir',f(u))+sec('Résultats et podiums',r.length?f(r):'<p class="mut">Les résultats et podiums seront publiés ici.</p>')+sec('Infos importantes',`<p>Licence FFK et certificat médical obligatoires. Contactez vos professeurs pour les sélections.</p>`)},
actualites:()=>sec('Actualités',news()),
inscriptions:()=>sec('Inscriptions',`<div class="two"><div><h3>Comment s'inscrire ?</h3><p>Venez essayer 2 cours gratuits, puis remettez votre dossier au dojo ou envoyez-le par e-mail.</p><h3>Tarifs</h3><p>${nl(D.club.tarifs)}</p><h3>Documents nécessaires</h3><p>${nl(D.club.docs).replace(/^/,'✔ ').replace(/<br>/g,'<br>✔ ')}</p><a class="btn" href="#contact">Nous contacter</a></div><div><h3>Formulaire d'inscription</h3>${mailForm(1,'Inscription KFV')}</div></div>`),
contact:()=>sec('Contact',`<div class="two"><div><p>📍 ${esc(D.club.adresse)}<br>📞 <a href="tel:${esc(D.club.tel.replace(/\s/g,''))}">${esc(D.club.tel)}</a><br>✉️ <a href="mailto:${esc(D.club.email)}">${esc(D.club.email)}</a></p><p><a class="btn o" target="_blank" href="${esc(D.club.facebook)}">Facebook</a><a class="btn o" target="_blank" href="${esc(D.club.instagram)}">Instagram</a></p><div class="map"><div>📍 Vesoul (70)<br><a class="btn" target="_blank" href="https://www.openstreetmap.org/search?query=Vesoul">Ouvrir la carte</a></div></div></div><div>${mailForm(0,'Contact KFV')}</div></div>`),
admin:()=>adminPage()};
/* ADMIN */
let ok=(()=>{try{return sessionStorage.getItem('kfv_ok')=='1'}catch(e){return false}})(),tab='events';
const S={events:{t:"Événements / calendrier",f:[['title','Titre'],['date','Date','date'],['time','Heure'],['place','Lieu'],['type','Type','sel',['Entraînement','Compétition','Stage','Passage de grade','Événement']],['desc','Description','area']],l:e=>e.title+' – '+e.date},
news:{t:"Actualités",f:[['title','Titre'],['date','Date','date'],['cat','Catégorie'],['img','Photo','img'],['text','Texte','area']],l:e=>e.title},
gallery:{t:"Photos et vidéos",f:[['img','Photo ou vidéo','media'],['vid','','hid'],['cat','Catégorie','sel',['Entraînements','Compétitions','Stages','Événements','Membres','Récompenses']],['caption','Légende']],l:e=>(e.vid?'🎬 ':'🖼 ')+(e.caption||e.cat)},
courses:{t:"Cours",f:[['name','Nom'],['age','Âge'],['desc','Description','area'],['time','Horaires'],['place','Lieu']],l:e=>e.name},
schedule:{t:"Horaires",f:[['day','Jour'],['time','Heure'],['course','Cours'],['place','Lieu']],l:e=>e.day+' '+e.time},
comps:{t:"Compétitions",f:[['title','Titre'],['date','Date','date'],['place','Lieu'],['status','Statut','sel',['À venir','Résultat']],['desc','Description / podiums','area'],['img','Photo','img']],l:e=>e.title},
club:{t:"Infos du club"},secu:{t:"Code d'accès"}};
function adminPage(){if(!ok){setTimeout(()=>{location.hash='accueil'});return''}
const tabs=Object.keys(S).map(k=>`<button class="btn ${k==tab?'':'o'}" onclick="tab='${k}';go()">${S[k].t}</button>`).join('');let body='';
if(tab=='secu')body=`<form onsubmit="return chgPw(event)"><label>Nouveau code (6 caractères min.)<input name="p" type="password" minlength="6" required></label><button class="btn">Changer le code</button></form><p class="mut">Accès secret : cliquez 5 fois sur « KFV » en bas de page, ou Ctrl+Maj+K.</p>`;else if(tab=='club')body=`<button class="btn" onclick="edit('club')">Modifier les infos du club</button>`;else body=`<button class="btn" onclick="edit('${tab}',-1)">+ Ajouter</button><div class="tbl adm"><table>${D[tab].map((e,i)=>`<tr><td>${esc(S[tab].l(e))}</td><td><button onclick="edit('${tab}',${i})">Modifier</button><button onclick="del('${tab}',${i})">Supprimer</button></td></tr>`).join('')}</table></div>`;
return sec('Administration',`<p class="mut">Les modifications sont enregistrées dans ce navigateur. Utilisez « Exporter » pour sauvegarder, « Importer » pour restaurer. Pensez à changer le code par défaut dans l'onglet « Code d'accès ».</p><div>${tabs}</div><div style="margin-top:20px">${body}</div><hr><button class="btn o" onclick="exp()">Exporter</button><label class="btn o">Importer<input type="file" hidden accept=".json" onchange="imp(this)"></label><button class="btn o" onclick="if(confirm('Tout réinitialiser ?')){D=JSON.parse(JSON.stringify(D0));save();go()}">Réinitialiser</button>`)}
function edit(k,i){const one=k=='club',o=one?D.club:(i>=0?D[k][i]:{});const F=one?[['nom','Nom'],['accroche','Accroche'],['presentation','Présentation','area'],['adresse','Adresse'],['tel','Téléphone'],['email','E-mail'],['facebook','Lien Facebook'],['instagram','Lien Instagram'],['tarifs','Tarifs (une ligne par tarif)','area'],['docs','Documents (une ligne par document)','area'],['hero','Photo d\'accueil','img']]:S[k].f;
$('#mod').innerHTML=`<form onsubmit="return saveF(event,'${k}',${i})"><h3>${one?'Infos du club':S[k].t}</h3>${F.map(([n,l,t,o2])=>`<label>${l}${t=='area'?`<textarea name="${n}" rows="4">${esc(o[n])}</textarea>`:t=='sel'?`<select name="${n}">${o2.map(x=>`<option ${o[n]==x?'selected':''}>${x}</option>`).join('')}</select>`:(t=='img'||t=='media')?`<input type="file" accept="${t=='media'?'image/*,video/*':'image/*'}" onchange="img(this,'${n}')"><input type="hidden" name="${n}" value="${esc(o[n])}">`:t=='hid'?`<input type="hidden" name="${n}" value="${esc(o[n])}">`:`<input name="${n}" type="${t||'text'}" value="${esc(o[n])}">`}</label>`).join('')}<button class="btn">Enregistrer</button><button type="button" class="btn o" onclick="$('#mod').classList.remove('on')">Annuler</button></form>`;$('#mod').classList.add('on')}
function img(inp,n){const f=inp.files[0];if(!f)return;const fm=inp.closest('form'),vd=fm.querySelector('[name=vid]');
if(f.type.startsWith('video/')){const id='v'+Date.now(),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(f);v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};v.onseeked=async()=>{v.onseeked=null;const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*v.videoHeight/v.videoWidth)||270;c.getContext('2d').drawImage(v,0,0,c.width,c.height);fm.querySelector('[name='+n+']').value=c.toDataURL('image/jpeg',.7);try{await vput(id,f);vd.value=id;alert('Vidéo prête : cliquez sur Enregistrer.')}catch(e){alert('Vidéo non enregistrée.')}};return}
if(vd)vd.value='';const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);inp.parentNode.querySelector(`[name=${n}]`).value=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function saveF(ev,k,i){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));if(k=='club')Object.assign(D.club,o);else if(i>=0)D[k][i]=o;else D[k].push(o);save();$('#mod').classList.remove('on');go();return false}
function del(k,i){if(confirm('Supprimer ?')){const v=D[k][i].vid;if(v)vdel(v).catch(()=>{});D[k].splice(i,1);save();go()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='kfv-donnees.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();go()}catch(e){alert('Fichier invalide')}};r.readAsText(i.files[0])}
/* ACCES */
const sha=async t=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return t}};
const setOk=v=>{ok=v;try{v?sessionStorage.setItem('kfv_ok','1'):sessionStorage.removeItem('kfv_ok')}catch(e){}$('#ab').classList.toggle('on',v)};
function login(){$('#mod').innerHTML=`<form onsubmit="return doLogin(event)"><h3>Accès réservé au club</h3><label>Code d'accès<input name="p" type="password" autofocus required></label><button class="btn">Entrer</button><button type="button" class="btn o" onclick="$('#mod').classList.remove('on')">Annuler</button></form>`;$('#mod').classList.add('on')}
async function doLogin(ev){ev.preventDefault();const p=new FormData(ev.target).get('p');let st=null;try{st=localStorage.getItem('kfv_pw')}catch(e){}
if(await sha(p)===(st||'5591c4f769a5bdda30c4258d0afb2a301364241e31d84620e8c775c6a64b9bd6')){setOk(true);$('#mod').classList.remove('on');location.hash='admin';go()}else alert('Code incorrect');return false}
async function chgPw(ev){ev.preventDefault();try{localStorage.setItem('kfv_pw',await sha(new FormData(ev.target).get('p')));alert('Code modifié.')}catch(e){alert('Impossible d\'enregistrer le code.')}return false}
function logout(){setOk(false);location.hash='accueil';go()}
let ck=0,ct;$('#sec').onclick=()=>{clearTimeout(ct);ct=setTimeout(()=>ck=0,2500);if(++ck>=5){ck=0;ok?location.hash='admin':login()}};
addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()=='k'){e.preventDefault();ok?location.hash='admin':login()}});
/* NAV */
const cm=d=>{cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cal.s=null;go()};
const idb=()=>new Promise((y,n)=>{const q=indexedDB.open('kfv',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>y(q.result);q.onerror=n});
const vput=async(id,b)=>{const d=await idb();return new Promise((y,n)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(b,id);t.oncomplete=y;t.onerror=n})};
const vget=async id=>{const d=await idb();return new Promise((y,n)=>{const q=d.transaction('v').objectStore('v').get(id);q.onsuccess=()=>y(q.result);q.onerror=n})};
const vdel=async id=>{const d=await idb();d.transaction('v','readwrite').objectStore('v').delete(id)};
function lbOpen(i){gi=i;lbShow();$('#lb').classList.add('on')}
async function lbShow(){const g=LB[gi],v=$('#lbv'),im=$('#lbi');v.pause();$('#lbc').textContent=g.caption||'';if(g.vid){im.style.display='none';v.style.display='block';try{const b=await vget(g.vid);v.src=b?URL.createObjectURL(b):'';if(!b)$('#lbc').textContent='Vidéo disponible uniquement sur l\'appareil qui l\'a ajoutée.'}catch(e){}}else{v.style.display='none';im.style.display='block';im.src=g.img}}
function lbGo(d){gi=(gi+d+LB.length)%LB.length;lbShow()}function lbClose(){$('#lbv').pause();$('#lb').classList.remove('on')}
function go(){const h=(location.hash||'#accueil').slice(1),p=R[h]?h:'accueil';$('#app').innerHTML=R[p]();$('#nav').innerHTML=P.map(([k,l])=>`<a href="#${k}" class="${k==p?'on':''}">${l}</a>`).join('');$('#nav').classList.remove('open');$('#fa').textContent=D.club.adresse;document.title=D.club.nom;scrollTo(0,0)}
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',go);$('#ab').classList.toggle('on',ok);addEventListener('keydown',e=>{if(e.key=='Escape')lbClose()});go();
</script></body></html>
